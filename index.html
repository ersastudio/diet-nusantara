<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet Nusantara · 28 Hari</title>
<meta name="theme-color" content="#2f7d4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diet Nusantara">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7f3ea; --surface:#fffdf8; --surface-2:#f1ece1; --line:#e6dfd1;
  --text:#1d2420; --text-2:#525c56; --muted:#7c857f;
  --primary:#2f7d4f; --primary-ink:#ffffff; --primary-soft:#dcefe2;
  --accent:#b9800f; --accent-soft:#fbefd2;
  --danger:#b83f2a; --danger-soft:#f8e1dc;
  --good:#1f7a33;
  --water:#2a78d6; --water-soft:#dbe9fb;
  --series-1:#2a78d6; --grid:#ece6da; --band:#2f7d4f;
  --shadow:0 1px 2px rgba(30,40,30,.05),0 6px 18px rgba(30,40,30,.06);
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111513; --surface:#1a201d; --surface-2:#232a26; --line:#2f3732;
    --text:#edeae3; --text-2:#c0c6c1; --muted:#8f9892;
    --primary:#4caf73; --primary-ink:#0b1710; --primary-soft:#1f3328;
    --accent:#f0b43c; --accent-soft:#3a3020;
    --danger:#e66767; --danger-soft:#3b2222;
    --good:#5cc27a;
    --water:#3987e5; --water-soft:#1c2c42;
    --series-1:#3987e5; --grid:#2a312d; --band:#4caf73;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:17px;font-weight:800}
h3{font-size:15px;font-weight:700}
p{margin:6px 0}
.app{max-width:560px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--primary);display:grid;place-items:center;font-size:20px;flex:none}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}
.lang-btn{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;cursor:pointer}
main{padding:14px 14px 104px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-h h2,.card-h h3{flex:1}
.page-h{font-size:22px;margin:4px 4px 12px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.note{font-size:13px;color:var(--text-2);background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:var(--primary-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.block{width:100%;margin-top:10px}
.btn.sm{padding:9px 12px;font-size:13px;white-space:nowrap}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn-row .btn{flex:1 1 140px}
textarea.bk{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.link{background:none;border:0;padding:4px 2px;color:var(--primary);font-weight:700;cursor:pointer;font-size:13px}
.link.danger{color:var(--danger)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);border:0}
.pill.link{cursor:pointer}
.badge-s{font-size:12px;font-weight:700;color:var(--accent);margin-left:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-date{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700}
.hero-date > span:first-child{text-transform:capitalize}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:16px;color:var(--muted);font-weight:700}
.wk{font-weight:700;color:var(--primary);margin-top:2px}
.streak{margin-top:6px;font-size:13px;font-weight:700}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--primary-soft);stroke-width:8}
.ring-fg{fill:none;stroke:var(--primary);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-t b{font-size:20px}
.ring-t span{font-size:11px;color:var(--muted)}

/* banner */
.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-color:transparent}
.banner p{font-size:13px;color:var(--text-2);margin:2px 0 0}
.flexnote{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}

/* checklists */
.check-row{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check-row.first,.card-h + .check-row,.flexnote + .check-row,h2 + .check-row{border-top:0}
.check-row.compact{padding:9px 0}
.check-row input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.check-row input:checked + .box{background:var(--primary);border-color:var(--primary)}
.check-row input:checked + .box::after{content:"";width:10px;height:5px;border:2.5px solid var(--primary-ink);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.check-row input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.ci{display:flex;flex-direction:column;gap:2px;min-width:0}
.slot{font-size:12px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
.slot em{font-style:normal;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:4px}
.txt{font-weight:500}
.check-row.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.check-row.nostrike.done .txt{color:var(--primary);text-decoration:none;font-weight:700}

/* exercise */
ul.ex{margin:8px 0;padding-left:20px}
ul.ex li{margin:3px 0}
.ex-icon{font-size:22px}

/* water */
.water{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px 0 4px}
.glass{aspect-ratio:3/4;border-radius:5px 5px 10px 10px;border:2px solid var(--water);background:transparent;cursor:pointer;padding:0;position:relative;overflow:hidden}
.glass.on{background:var(--water)}
.glass:not(.on):hover{background:var(--water-soft)}

/* steps & meter */
.steps-in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--primary-soft);overflow:hidden;margin:10px 0 6px}
.meter span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.meter.lg{height:10px;margin-top:14px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--surface);font-weight:700;font-size:13px;color:var(--text-2);cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.wk-title{font-weight:800;color:var(--primary);margin:2px 4px 10px}

/* menu */
.mday.is-today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
dl.mlist{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
dl.mlist dt{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
dl.mlist dd{margin:0}

/* weight */
.w-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-num small{font-size:18px;color:var(--muted)}
.bmi{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.bmi b{font-size:20px}
.bmi span{font-size:12px;font-weight:700;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted);font-weight:600}
.stats b{font-size:16px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text-2);font-weight:700;margin-top:10px}
.field i{font-weight:500;font-style:normal;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;color:var(--text)}
.err{color:var(--danger);font-size:13px;font-weight:600}
table.hist{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
table.hist th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
table.hist td{padding:9px 4px;border-bottom:1px solid var(--line)}
table.hist tr:last-child td{border-bottom:0}
td.down{color:var(--good);font-weight:700}
td.up{color:var(--danger);font-weight:700}

/* chart */
.chart-wrap{position:relative;margin-top:8px}
.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.grid{stroke:var(--grid);stroke-width:1}
.ax{fill:var(--muted);font-size:10.5px;font-family:inherit}
.band{fill:var(--band);opacity:.12}
.tline{stroke:var(--text-2);stroke-width:1}
.tlabel{fill:var(--text-2);font-size:10.5px;font-weight:700;font-family:inherit}
.sline{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--series-1);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--muted);stroke-width:1;pointer-events:none}
.hdot{fill:var(--series-1);stroke:var(--surface);stroke-width:2;pointer-events:none}
.hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.tt{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;line-height:1.3;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .1s}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--text-2)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.k-line{width:16px;height:2px;background:var(--series-1);border-radius:2px}
.k-band{width:14px;height:10px;background:var(--band);opacity:.25;border-radius:3px}
.k-target{width:16px;height:0;border-top:1px solid var(--text-2)}

/* recipes & tips */
details.recipe{padding:0}
details.recipe summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
details.recipe[open] summary::after{transform:rotate(90deg)}
.r-emoji{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:none}
details.recipe summary span:not(.r-emoji){display:flex;flex-direction:column}
details.recipe summary small{color:var(--muted);font-size:12px;font-weight:500}
details.recipe .body{padding:0 16px 14px}
details.recipe h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 4px}
details.recipe ul,details.recipe ol,.tips ul{margin:0;padding-left:20px}
details.recipe li,.tips li{margin:4px 0}
.tips h2{margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two h3{font-size:13px;margin-bottom:4px}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 11px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700}
nav.tabs a .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65}
nav.tabs a.on{color:var(--primary)}
nav.tabs a.on .ic{filter:none;opacity:1}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:10;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.backdrop[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet h3{margin-top:18px}
.sync-line{font-weight:700}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.welcome{text-align:center;padding:24px 18px}
.welcome .emoji{font-size:44px}
.welcome .field{text-align:left}
</style>
</head>
<body>
<div class="app">

</div>
<nav class="tabs"><div class="inner" id="tabs"></div></nav>
<div class="backdrop" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status"></div>

const isYmd=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);

const num=(v,def,min,max)=>{v=Number(v);return isFinite(v)?clamp(v,min,max):def;};

/* ================= STATE ================= */
const LS_KEY="dietNusantara.v1";
function defaultState(){return {v:1,lang:"id",startDate:null,profile:{height:160,startWeight:65,target:58},days:{},weights:[],shop:{},prep:{},updatedAt:0};}
function normalize(s){
  const o=defaultState();
  if(!s||typeof s!=="object")return o;
  o.lang=s.lang==="tr"?"tr":"id";
  o.startDate=isYmd(s.startDate)?s.startDate:null;
  const p=s.profile||{};
  o.profile={height:num(p.height,160,100,230),startWeight:num(p.startWeight,65,30,250),target:num(p.target,58,30,250)};
  if(s.days&&typeof s.days==="object")for(const k of Object.keys(s.days)){
    if(!isYmd(k))continue;const r=s.days[k]||{};
    o.days[k]={m:[0,1,2,3,4].map(i=>Array.isArray(r.m)&&r.m[i]?1:0),ex:r.ex?1:0,w:Math.round(num(r.w,0,0,10)),st:Math.round(num(r.st,0,0,100000))};
  }
  if(Array.isArray(s.weights))o.weights=s.weights.filter(x=>x&&isYmd(x.date)&&isFinite(Number(x.kg))).map(x=>({date:x.date,kg:Math.round(num(x.kg,0,30,250)*10)/10,waist:Number(x.waist)>=40&&Number(x.waist)<=200?Math.round(Number(x.waist)*10)/10:null})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const key of ["shop","prep"])if(s[key]&&typeof s[key]==="object")for(const k of Object.keys(s[key]))if(/^[a-z0-9]{1,8}$/.test(k)&&s[key][k])o[key][k]=true;
  o.updatedAt=num(s.updatedAt,0,0,1e15);
  return o;
}

/* ================= PROGRAM LOGIC ================= */
function info(date){
  if(!state.startDate)return null;
  const n=diffDays(state.startDate,date);
  if(n<0)return {before:true,n};
  const inM=n%28;
  return {before:false,n,month:Math.floor(n/28)+1,dayInMonth:inM+1,week:Math.floor(inM/7),wd:(parse(date).getDay()+6)%7};
}
const level=inf=>inf.month>1?3:inf.week;
function score(date){
  const r=state.days[date];if(!r)return 0;
  const inf=info(date);if(!inf||inf.before)return 0;
  return r.m.reduce((a,b)=>a+b,0)+(r.ex?1:0)+(r.w>=8?1:0)+(r.st>=STEPS[level(inf)]?1:0);
}
function streak(){
  if(!state.startDate)return 0;
  let d=today();if(score(d)<6)d=addDays(d,-1);
  let n=0;while(d>=state.startDate&&score(d)>=6&&n<1000){n++;d=addDays(d,-1);}
  return n;
}

let chartPts=[];
function chartSVG(){
  const p=state.profile,start=state.startDate;
  const pts=state.weights.map(w=>({date:w.date,kg:w.kg}));
  if(start&&!pts.some(x=>x.date<=start))pts.unshift({date:start,kg:p.startWeight,base:true});
  chartPts=[];
  if(!pts.length)return `<p class="muted">${t("noData")}</p>`;
  const d0=pts[0].date;
  const ends=[pts[pts.length-1].date];if(start)ends.push(addDays(start,27));
  const dEnd=ends.sort().pop();
  const span=Math.max(diffDays(d0,dEnd),7);
  const W=340,H=210,ml=30,mr=12,mt=16,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const vals=pts.map(x=>x.kg).concat([p.target]);
  const yMin=Math.floor(Math.min(...vals))-1,yMax=Math.ceil(Math.max(...vals,p.startWeight))+1;
  const X=d=>ml+diffDays(d0,d)/span*iw,Y=v=>mt+(yMax-v)/(yMax-yMin)*ih;
  const stepY=(yMax-yMin)>10?2:1;
  let g="";
  for(let v=yMin;v<=yMax;v+=stepY)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="grid"/><text x="${ml-6}" y="${(Y(v)+3.5).toFixed(1)}" class="ax" text-anchor="end">${v}</text>`;
  let band="";
  if(start&&start<=dEnd){
    const up=[],lo=[],sw=p.startWeight,days=diffDays(start,dEnd);
    for(let i=0;i<=days;i++){const d=addDays(start,i),x=X(d).toFixed(1);up.push(x+","+Y(Math.max(p.target,sw-0.5*i/7)).toFixed(1));lo.push(x+","+Y(Math.max(p.target,sw-i/7)).toFixed(1));}
    band=`<polygon class="band" points="${up.concat(lo.reverse()).join(" ")}"/>`;
  }
  const ty=Y(p.target);
  const target=`<line x1="${ml}" x2="${W-mr}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" class="tline"/><text x="${W-mr}" y="${(ty+13).toFixed(1)}" class="tlabel" text-anchor="end">${esc(t("target"))} ${fmtNum(p.target)} kg</text>`;
  const path=pts.map((q,i)=>(i?"L":"M")+X(q.date).toFixed(1)+" "+Y(q.kg).toFixed(1)).join(" ");
  const dots=pts.map(q=>`<circle cx="${X(q.date).toFixed(1)}" cy="${Y(q.kg).toFixed(1)}" r="4.5" class="dot"/>`).join("");
  const xl=`<text x="${ml}" y="${H-6}" class="ax">${esc(fmtShort(d0))}</text><text x="${W-mr}" y="${H-6}" class="ax" text-anchor="end">${esc(fmtShort(dEnd))}</text>`;
  chartPts=pts.map(q=>({x:X(q.date),y:Y(q.kg),date:q.date,kg:q.kg,base:!!q.base}));
  const last=pts[pts.length-1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartTitle"))}: ${esc(fmtNum(last.kg))} kg">${g}${band}${target}<path d="${path}" class="sline"/>${dots}<line class="xh" x1="0" x2="0" y1="${mt}" y2="${H-mb}" style="opacity:0"/><circle class="hdot" r="6" cx="-20" cy="-20" style="opacity:0"/>${xl}<rect class="hit" x="${ml}" y="0" width="${iw}" height="${H-mb}"/></svg><div class="tt" id="tt"></div></div>
  <div class="keys"><span><i class="k-line"></i>${t("series")}</span><span><i class="k-band"></i>${t("healthyBand")}</span><span><i class="k-target"></i>${t("target")} ${fmtNum(p.target)} kg</span></div>`;
}
function bindChart(){
  const svg=document.querySelector(".chart-wrap svg");if(!svg||!chartPts.length)return;
  const tt=$("#tt"),xh=svg.querySelector(".xh"),hd=svg.querySelector(".hdot"),hit=svg.querySelector(".hit"),wrap=svg.parentNode;
  const move=ev=>{
    const r=svg.getBoundingClientRect(),sx=340/r.width,mx=(ev.clientX-r.left)*sx;
    let best=null,bd=1e9;chartPts.forEach(q=>{const d=Math.abs(q.x-mx);if(d<bd){bd=d;best=q;}});
    if(!best)return;
    xh.setAttribute("x1",best.x);xh.setAttribute("x2",best.x);xh.style.opacity=1;
    hd.setAttribute("cx",best.x);hd.setAttribute("cy",best.y);hd.style.opacity=1;
    tt.innerHTML=`<b>${esc(fmtNum(best.kg))} kg</b><br>${esc(fmtShort(best.date))}${best.base?" · "+esc(t("startW")):""}`;
    const left=clamp(best.x/sx,48,wrap.clientWidth-48);
    tt.style.left=left+"px";tt.style.top=(best.y/sx)+"px";tt.style.opacity=1;
  };
  const leave=()=>{xh.style.opacity=0;hd.style.opacity=0;tt.style.opacity=0;};
  hit.addEventListener("pointermove",move);hit.addEventListener("pointerdown",move);hit.addEventListener("pointerleave",leave);
}

  if(ui.tab==="weight")bindChart();
  if(ui.sheet)renderSheet();else $("#sheet").hidden=true;
  if(fk){const el=document.querySelector(`[data-fk="${fk}"]`);if(el)el.focus({preventScroll:true});}
}
function renderSheet(){
  const p=state.profile,el=$("#sheet");el.hidden=false;
  el.querySelector(".sheet").innerHTML=`<div class="sheet-h"><h2 id="sheetTitle">${t("settings")}</h2><button class="icon-btn" data-act="closeSheet" data-fk="close" aria-label="${t("close")}">✕</button></div>
  <label class="field">${t("language")}<select data-act="set-lang"><option value="id"${state.lang==="id"?" selected":""}>Bahasa Indonesia</option><option value="tr"${state.lang==="tr"?" selected":""}>Türkçe</option></select></label>
  <label class="field">${t("startDate")}<input type="date" data-act="set-start" value="${state.startDate||""}"></label>
  <div class="form-row"><label class="field">${t("height")}<input type="text" inputmode="decimal" data-act="set-height" value="${p.height}"></label><label class="field">${t("startWeight")}<input type="text" inputmode="decimal" data-act="set-sw" value="${p.startWeight}"></label><label class="field">${t("targetWeight")}<input type="text" inputmode="decimal" data-act="set-target" value="${p.target}"></label></div>
  <h3>${t("syncTitle")}</h3><p class="sync-line" id="syncLine">${syncText()}</p><p class="muted sm">${hasClaude()?t("syncNote"):t("localNote")}</p>
  ${!isFramed()&&!isStandalone()?`<div class="note"><b>${t("installTitle")}</b><br>${esc(t("installTxt"))}</div>`:""}
  <h3>${t("backupTitle")}</h3><p class="muted sm">${t("backupTxt")}</p>
  <div class="btn-row"><button class="btn ghost" data-act="copyBackup">📋 ${t("copyBackup")}</button>${!isFramed()?`<button class="btn ghost" data-act="downloadBackup">⬇️ ${t("downloadBackup")}</button>`:""}</div>
  ${ui.backupText?`<p class="muted sm">${t("copyFail")}</p><textarea class="bk" id="bkOut" readonly rows="4">${esc(ui.backupText)}</textarea>`:""}
  <label class="field">${t("restoreLbl")}<textarea class="bk" id="bkIn" rows="3" placeholder="${t("restorePh")}">${esc(ui.restoreDraft||"")}</textarea></label>
  <label class="field">${t("orFile")}<input type="file" accept=".json,application/json,text/plain" data-act="restoreFile"></label>
  <button class="btn block" data-act="restoreBackup">${ui.confirm==="restore"?t("restoreSure"):t("restoreBtn")}</button>
  <h3>&nbsp;</h3>
  <button class="btn danger block" data-act="resetAll">${ui.confirm==="resetAll"?t("resetAllSure"):t("resetAll")}</button>`;
}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800);}
function twoTap(key,fn){
  if(ui.confirm===key){ui.confirm=null;fn();return;}
  ui.confirm=key;render();
  setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render();}},3500);
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){ui.sheet=false;ui.confirm=null;ui.backupText=null;render();return;}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case "water":{const r=mutRec(ui.date),n=+el.dataset.n;r.w=r.w===n?n-1:n;commit();break;}
    case "prev":ui.date=addDays(ui.date,-1);render();break;
    case "next":ui.date=addDays(ui.date,1);render();break;
    case "gotoday":ui.date=today();render();break;
    case "start":{const v=$("#startInput").value;state.startDate=isYmd(v)?v:today();ui.date=today();commit();break;}
    case "startToday":state.startDate=today();ui.date=today();commit();break;
    case "week":ui.menuWeek=+el.dataset.w;render();break;
    case "openday":ui.date=el.dataset.date;if(location.hash==="#today"){render();window.scrollTo(0,0);}else location.hash="today";break;
    case "rectab":ui.recTab=el.dataset.v;render();break;
    case "shoptab":ui.shopTab=el.dataset.v;ui.confirm=null;render();break;
    case "saveWeight":{
      const d=$("#wDate").value,kg=parseDec($("#wKg").value),wa=parseDec($("#wWaist").value),err=$("#wErr");
      if(!isYmd(d)||!(kg>=30&&kg<=250)){err.textContent=t("invalidKg");err.hidden=false;return;}
      state.weights=state.weights.filter(x=>x.date!==d);
      state.weights.push({date:d,kg:Math.round(kg*10)/10,waist:wa>=40&&wa<=200?Math.round(wa*10)/10:null});
      state.weights.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
      commit();toast(t("saved"));break;}
    case "delw":{const d=el.dataset.date;twoTap("delw:"+d,()=>{state.weights=state.weights.filter(x=>x.date!==d);commit();});break;}
    case "resetShop":twoTap("resetShop",()=>{state.shop={};commit();});break;
    case "resetPrep":twoTap("resetPrep",()=>{state.prep={};commit();});break;
    case "resetAll":twoTap("resetAll",()=>{const lang=state.lang;state=defaultState();state.lang=lang;ui.sheet=false;ui.date=today();commit();});break;
    case "settings":ui.sheet=true;ui.confirm=null;render();const c=document.querySelector('[data-fk="close"]');if(c)c.focus();break;
    case "closeSheet":ui.sheet=false;ui.confirm=null;ui.backupText=null;render();$("#settingsBtn").focus();break;
    case "lang":state.lang=state.lang==="tr"?"id":"tr";commit();break;
    case "copyBackup":{
      const json=JSON.stringify(state);
      const fail=()=>{ui.backupText=json;renderSheet();const o=$("#bkOut");if(o){o.focus();o.select();}};
      try{navigator.clipboard.writeText(json).then(()=>{ui.backupText=null;renderSheet();toast(t("copied"));},fail);}catch(err){fail();}
      break;}
    case "downloadBackup":{
      try{const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diet-nusantara-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(err){}
      break;}
    case "restoreBackup":{
      const box=$("#bkIn"),txt=(box?box.value:"").trim();ui.restoreDraft=txt;
      let parsed=null;try{parsed=JSON.parse(txt);}catch(err){}
      if(!parsed||typeof parsed!=="object"||parsed.v!==1){ui.confirm=null;toast(t("badBackup"));break;}
      twoTap("restore",()=>{const lang=state.lang;state=normalize(parsed);if(!parsed.lang)state.lang=lang;ui.restoreDraft="";ui.sheet=false;ui.date=today();commit();toast(t("restored"));});
      break;}
  }
});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="bkIn")ui.restoreDraft=e.target.value;});
document.addEventListener("change",e=>{
  const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;
  const p=state.profile;
  switch(a){
    case "meal":mutRec(ui.date).m[+el.dataset.i]=el.checked?1:0;commit();break;
    case "ex":mutRec(ui.date).ex=el.checked?1:0;commit();break;
    case "steps":mutRec(ui.date).st=Math.round(num(el.value,0,0,100000));commit();break;
    case "shop":case "prep":{const k=el.dataset.k;if(el.checked)state[a][k]=true;else delete state[a][k];commit();break;}
    case "set-lang":state.lang=el.value==="tr"?"tr":"id";commit();break;
    case "set-start":if(isYmd(el.value)){state.startDate=el.value;ui.date=today();commit();}break;
    case "set-height":p.height=num(parseDec(el.value),p.height,100,230);commit();break;
    case "set-sw":p.startWeight=num(parseDec(el.value),p.startWeight,30,250);commit();break;
    case "set-target":p.target=num(parseDec(el.value),p.target,30,250);commit();break;
    case "restoreFile":{const f=el.files&&el.files[0];if(f&&f.size<2e6)f.text().then(txt=>{ui.restoreDraft=txt;ui.confirm=null;renderSheet();}).catch(()=>{});break;}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ui.sheet){ui.sheet=false;ui.confirm=null;ui.backupText=null;render();$("#settingsBtn").focus();}
  if(e.key==="Enter"&&e.target&&e.target.dataset&&e.target.dataset.act==="steps")e.target.blur();
});
function readHash(){const h=location.hash.replace("#","");ui.tab=TABS.some(x=>x[0]===h)?h:"today";}
window.addEventListener("hashchange",()=>{readHash();ui.confirm=null;render();window.scrollTo(0,0);});

/* ================= CLOUD SYNC (claude.ai db, per-person private) ================= */
const cloud={status:"local",ref:null,dirty:false,writing:false,timer:null,reconciled:false};
function setSync(s){cloud.status=s;const b=$("#syncBadge");if(b)b.textContent=syncText();const l=$("#syncLine");if(l)l.textContent=syncText();}
function queueCloud(){if(!cloud.ref)return;cloud.dirty=true;clearTimeout(cloud.timer);cloud.timer=setTimeout(flush,700);}
async function flush(){
  if(!cloud.ref||cloud.writing||!cloud.dirty)return;
  cloud.writing=true;let tries=0;
  while(cloud.dirty){
    cloud.dirty=false;setSync("saving");
    try{await cloud.ref.set(JSON.parse(JSON.stringify(state)));setSync("synced");tries=0;}
    catch(e){if(e&&e.code==="unavailable"&&tries<1){tries++;cloud.dirty=true;await sleep(800+Math.random()*1200);}else{setSync("error");break;}}
  }
  cloud.writing=false;
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  setSync("connecting");
  try{
    const db=await window.claude.use("db"),user=await window.claude.use("user");
    if(!db||!user){setSync("local");return;}
    const uid=await user.id();
    if(!uid){setSync("local");return;}
    const ref=db.doc("data/users/"+uid+"/state");
    const timer=setTimeout(()=>{if(!cloud.reconciled)setSync("offline");},10000);
    ref.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      const remote=snap.exists?snap.data():null;
      const rU=remote?Number(remote.updatedAt)||0:0;
      if(remote&&rU>(state.updatedAt||0)){state=normalize(JSON.parse(JSON.stringify(remote)));saveLocal();render();}
      if(!(snap.metadata&&snap.metadata.fromCache)&&!cloud.reconciled){
        cloud.reconciled=true;clearTimeout(timer);cloud.ref=ref;
        if((state.updatedAt||0)>rU){cloud.dirty=true;flush();}else setSync("synced");
      }
    },()=>{clearTimeout(timer);setSync("error");});
  }catch(e){setSync("local");}
}

/* ================= START ================= */
readHash();
render();
initCloud();
// Offline support when hosted on its own (not inside claude.ai's frame)
if("serviceWorker" in navigator&&!isFramed()&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
})();
</script>
